<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tilamatriisi – demo</title>
  <link rel="stylesheet" href="proto.css" />
</head>
<body>
  <header class="bar">
    <a class="back" href="../../../../index.html">Playground</a>
    <p class="meta">Tilamatriisi · Atte · v1</p>
  </header>
  <main class="page">
    <div class="heading">
      <h1 id="course-title">Ladataan…</h1>
      <div class="view" role="group" aria-label="Näkymä">
        <button type="button" id="view-matrix" aria-pressed="true">Matriisi</button>
        <button type="button" id="view-nav" aria-pressed="false">Navigaatio</button>
      </div>
    </div>
    <p id="proto-status" class="status" role="status"></p>
    <div id="matrix-scroll" class="matrix-scroll" tabindex="0">
      <div id="board" class="board"></div>
    </div>
    <section id="detail" class="detail" aria-live="polite" hidden>
      <h2 id="detail-title"></h2>
      <p id="detail-body"></p>
      <ol id="detail-questions"></ol>
    </section>
  </main>
  <script type="module" src="proto.mjs"></script>
</body>
</html>
